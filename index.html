<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PS VR2 — OLED TEST</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
body{color:#fff}
#menu{position:fixed;inset:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;gap:22px;z-index:2;padding:24px;overflow:hidden}
h1{font-size:clamp(28px,5vw,56px);margin:0 0 8px;text-align:center}
#buttons{box-sizing:border-box;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;width:min(100%,1000px);max-width:100%;padding:4px}
.lang{min-width:84px;padding:8px 14px;font-size:20px}.lang.active{background:#fff;color:#000}button{box-sizing:border-box;font-size:clamp(18px,2.7vw,32px);font-weight:700;padding:18px 24px;border:3px solid rgba(255,255,255,.9);border-radius:12px;color:#fff;min-width:170px;min-height:76px;cursor:pointer;box-shadow:none}
#buttons button:nth-child(1){background:#000;color:#fff}
#buttons button:nth-child(2){background:#fff;color:#000}
#buttons button:nth-child(3){background:#f00;color:#fff}
#buttons button:nth-child(4){background:#0f0;color:#000}
#buttons button:nth-child(5){background:#00f;color:#fff}
#buttons button.selected{transform:scale(1.02);box-shadow:0 0 0 4px #fff}
#buttons button:focus{outline:none}
#help{font-size:clamp(16px,2vw,24px);text-align:center;line-height:1.5;opacity:.9;max-width:900px;padding:0 20px}
#test{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#timer,#testHelp{display:none!important}
@media (max-width:700px){#buttons{gap:10px}#buttons button{min-width:130px;min-height:62px;padding:14px 16px}#help{max-width:95%;font-size:16px}h1{font-size:30px}}
</style>
</head>
<body>
<div id="menu">
  <div id="lang"><button id="ru" class="lang active">RU</button><button id="en" class="lang">EN</button></div>
  <h1>PS VR2 — OLED TEST</h1>
  <div id="buttons">
    <button data-color="#000000">ЧЁРНЫЙ</button>
    <button data-color="#ffffff">БЕЛЫЙ</button>
    <button data-color="#ff0000">КРАСНЫЙ</button>
    <button data-color="#00ff00">ЗЕЛЁНЫЙ</button>
    <button data-color="#0000ff">СИНИЙ</button>
  </div>
  <div id="help">Выберите цвет крестовиной или левым стиком PS5 и нажмите ✕ (X).<br>После выбора цвет показывается 15 секунд, затем автоматически возвращается меню.</div>
</div>
<div id="test"></div>
<div id="timer"></div>
<div id="testHelp"></div>
<script>
const menu=document.getElementById('menu');
const test=document.getElementById('test');
const timer=document.getElementById('timer');
const buttons=[...document.querySelectorAll('#buttons button')];

let selected=0, gamepadIndex=null, lastAxes=0, lastButtons=[];
let countdown=null, endAt=0;
let lang='ru';
const texts={ru:{title:'PS VR2 — OLED TEST',black:'ЧЁРНЫЙ',white:'БЕЛЫЙ',red:'КРАСНЫЙ',green:'ЗЕЛЁНЫЙ',blue:'СИНИЙ',help:'Выберите цвет крестовиной или левым стиком PS5 и нажмите ✕ (X).',hint:'Тест длится 15 секунд — затем автоматический возврат к выбору.',test:'ПРОВЕРКА OLED',sec:'сек.'},en:{title:'PS VR2 — OLED TEST',black:'BLACK',white:'WHITE',red:'RED',green:'GREEN',blue:'BLUE',help:'Select a color with the D-pad or left stick and press ✕ (X).',hint:'Test lasts 15 seconds — then returns to color selection.',test:'OLED TEST',sec:'sec.'}};
function setLanguage(l){lang=l; document.documentElement.lang=l; document.getElementById('ru').classList.toggle('active',l==='ru');document.getElementById('en').classList.toggle('active',l==='en');const t=texts[l];document.querySelector('h1').textContent=t.title;buttons[0].textContent=t.black;buttons[1].textContent=t.white;buttons[2].textContent=t.red;buttons[3].textContent=t.green;buttons[4].textContent=t.blue;document.getElementById('help').innerHTML=t.help+'<br>'+t.hint;}


function updateSelection(){
  buttons.forEach((b,i)=>b.classList.toggle('selected',i===selected));
  buttons[selected].scrollIntoView({block:'nearest',inline:'nearest'});
}
function showMenu(){
  if(countdown){clearInterval(countdown);countdown=null;}
  menu.style.display='flex'; test.style.display='none';
  timer.style.display='none'; document.getElementById('testHelp').style.display='none';
  document.body.style.background='#111';
  updateSelection();
}
function startTest(i){
  selected=i;
  const color=buttons[i].dataset.color;
  menu.style.display='none'; test.style.display='flex';
  document.body.style.background=color; test.style.background=color;
  endAt=Date.now()+15000;
  timer.style.display='none'; document.getElementById('testHelp').style.display='none';
  if(countdown) clearInterval(countdown);
  countdown=setInterval(()=>{
    updateTimer();
    if(Date.now()>=endAt) showMenu();
  },100);
}
function updateTimer(){timer.textContent=Math.max(0,Math.ceil((endAt-Date.now())/1000))+' '+texts[lang].sec;}
document.getElementById('ru').onclick=()=>setLanguage('ru');document.getElementById('en').onclick=()=>setLanguage('en');
buttons.forEach((b,i)=>{
  b.addEventListener('click',()=>startTest(i));
  b.addEventListener('mouseenter',()=>{selected=i;updateSelection();});
});

document.addEventListener('keydown',e=>{
  if(menu.style.display!=='none'){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){selected=(selected+1)%buttons.length;updateSelection();}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){selected=(selected+buttons.length-1)%buttons.length;updateSelection();}
    else if(e.key==='Enter'||e.key===' '||e.key.toLowerCase()==='x') startTest(selected);
  } else if(e.key==='Escape'||e.key.toLowerCase()==='m') showMenu();
});

window.addEventListener('gamepadconnected',e=>{gamepadIndex=e.gamepad.index;});
window.addEventListener('gamepaddisconnected',e=>{if(gamepadIndex===e.gamepad.index)gamepadIndex=null;});
function pollGamepad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  let gp=gamepadIndex!=null?gps[gamepadIndex]:null;
  if(!gp){for(let g of gps){if(g){gp=g;gamepadIndex=g.index;break;}}}
  if(gp && menu.style.display!=='none'){
    const now=Date.now();
    const x=gp.axes?.[0]||0, y=gp.axes?.[1]||0;
    if(now-lastAxes>220){
      if(x>0.5 || y>0.5){selected=(selected+1)%buttons.length;updateSelection();lastAxes=now;}
      else if(x<-0.5 || y<-0.5){selected=(selected+buttons.length-1)%buttons.length;updateSelection();lastAxes=now;}
    }
    const pressed=gp.buttons?.[0]?.pressed;
    if(pressed && !lastButtons[0]) startTest(selected);
    lastButtons[0]=pressed;
  }
  requestAnimationFrame(pollGamepad);
}
setLanguage('ru');updateSelection();
pollGamepad();
</script>
</body>
</html>
