<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS VR2 OLED Test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center}.menu{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.78);padding:28px;border-radius:18px}.menu h1{margin:0 0 18px;font-size:30px}.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.buttons button{min-width:125px;padding:16px 12px;border:0;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer}.help{margin-top:16px;font-size:14px;color:#ccc}button[data-c=black]{background:#000;color:#fff;border:1px solid #777}button[data-c=white]{background:#fff;color:#000}button[data-c=red]{background:#f00;color:#fff}button[data-c=green]{background:#0f0;color:#000}button[data-c=blue]{background:#00f;color:#fff}</style></head><body><div id="screen"></div><div class="menu" id="menu"><h1>PS VR2 — OLED TEST</h1><div class="buttons"><button data-c="black">ЧЁРНЫЙ</button><button data-c="white">БЕЛЫЙ</button><button data-c="red">КРАСНЫЙ</button><button data-c="green">ЗЕЛЁНЫЙ</button><button data-c="blue">СИНИЙ</button></div><div class="help">После выбора экран становится полностью однотонным. Нажмите M или Esc для возврата.</div></div><script>const s=document.getElementById('screen'),m=document.getElementById('menu');function show(c){s.style.display='flex';s.style.background=c==='black'?'#000':c==='white'?'#fff':c==='red'?'#f00':c==='green'?'#0f0':'#00f';m.style.display='none'}function back(){s.style.display='none';m.style.display='block'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.c));document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key.toLowerCase()==='m')back()});</script></body></html>
